name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to the same branch cancels the run still in flight
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: JVM (Kotlin / Spring Boot)
    runs-on: ubuntu-latest
    env:
      # empty on forks and Dependabot PRs — the Sonar step is skipped rather than failing
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # optional overrides; unset falls back to the defaults in build.gradle.kts
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs a full history to attribute issues to commits and work out "new code"
          fetch-depth: 0

      # every module declares a Java 22 toolchain; if one ever diverges, add its version here
      # too, and Gradle's toolchain detection will pick the right JDK per module
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships with Docker, so Testcontainers spins up real PostgreSQL for
      # CoreServiceApplicationTests
      - name: Run tests
        run: ./gradlew test --stacktrace

      # ai-analyser is not a Gradle module, but Sonar analyses it as part of the same project,
      # so its coverage report has to exist in this workspace before the scanner runs
      - name: Set up Python 3.11
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-analyser/requirements-dev.txt

      - name: Generate Python coverage for Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: ai-analyser
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=xml

      - name: Cache Sonar packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew sonar --info

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
            **/build/reports/jacoco/test/
          retention-days: 7
          if-no-files-found: ignore

  ai-analyser:
    name: Python (ai-analyser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-analyser

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-analyser/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # every test here mocks the LLM, RabbitMQ and the database, so nothing external is needed
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-analyser-coverage
          path: ai-analyser/coverage.xml
          retention-days: 7
          if-no-files-found: ignore
