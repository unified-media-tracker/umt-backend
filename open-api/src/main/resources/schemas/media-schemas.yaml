components:
  schemas:
    MediaItemResponse:
      type: object
      required:
        - id
        - mediaType
        - title
        - releaseDateStatus
        - popularityScore
        - ratingCount
        - externalSource
        - externalSourceId
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          $ref: '#/components/schemas/MediaType'
        title:
          type: string
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        ageRating:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        releaseDateStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        popularityScore:
          type: number
        averageUserRating:
          type: number
          nullable: true
        ratingCount:
          type: integer
          format: int32
        franchiseId:
          type: string
          format: uuid
          nullable: true
        externalSource:
          $ref: '#/components/schemas/ExternalSourceType'
        externalSourceId:
          type: string
        genres:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GenreResponse'
          default: []
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/ContributorResponse'
          default: []
        movieDetails:
          $ref: '#/components/schemas/MovieDetails'

    MovieDetails:
      type: object
      nullable: true
      required: [ runtimeMinutes ]
      properties:
        runtimeMinutes:
          type: integer
          format: int32

    ContributorResponse:
      type: object
      required: [id, name, contributorType, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contributorType:
          $ref: '#/components/schemas/ContributorType'
        role:
          $ref: '#/components/schemas/RoleType'

    ContributorType:
      type: string
      enum:
        - PERSON
        - ORGANIZATION

    RoleType:
      type: string
      enum:
        - DIRECTOR
        - DEVELOPER
        - AUTHOR
        - ARTIST
        - WRITER
        - STUDIO
        - PUBLISHER

    GenreResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    MediaType:
      type: string
      enum:
        - MOVIE
        - GAME
        - BOOK
        - MUSIC
        - TV_SHOW

    ReleaseStatus:
      type: string
      enum:
        - TBA
        - ANNOUNCED
        - RUMORED
        - CONFIRMED
        - DELAYED
        - RELEASED
        - CANCELED

    ExternalSourceType:
      type: string
      enum:
        - TMDB
        - IGDB
        - MUSICBRAINZ
        - HARDCOVER

    MediaItemRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64