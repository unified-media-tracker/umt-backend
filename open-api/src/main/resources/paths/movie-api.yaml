importMovieFromTmdb:
  post:
    tags: [Movie]
    operationId: importMovieFromTmdb
    summary: "Import movie from TMDB"
    description: "Imports a movie from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: './media-api.yaml#/components/schemas/MovieResponse'

syncUpcomingMovies:
  post:
    tags: [Movie]
    operationId: syncUpcomingMovies
    summary: "Sync upcoming movies from TMDB"
    description: "Queries TMDB's /movie/upcoming and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './media-api.yaml#/components/schemas/MovieResponse'