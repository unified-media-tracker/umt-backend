importTvShowFromTmdb:
  post:
    tags: [Media]
    operationId: importTvShowFromTmdb
    summary: "Import TV show from TMDB"
    description: "Imports a TV show from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'

syncUpcomingTvSeries:
  post:
    tags: [Media]
    operationId: syncUpcomingTvSeries
    summary: "Sync upcoming TV series from TMDB"
    description: "Queries TMDB's /discover/tv filtered to a future first_air_date and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'

syncUpcomingAlbums:
  post:
    tags: [Media]
    operationId: syncUpcomingAlbums
    summary: "Sync upcoming albums from Metacritic + MusicBrainz"
    description: "Scrapes Metacritic's upcoming album calendar for {artist, title, date}, resolves each against MusicBrainz, and imports confident matches. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'

syncUpcomingGames:
  post:
    tags: [Media]
    operationId: syncUpcomingGames
    summary: "Sync upcoming games from IGDB"
    description: "Queries IGDB for main-category games with a future first_release_date and imports them. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'

syncUpcomingBooks:
  post:
    tags: [Media]
    operationId: syncUpcomingBooks
    summary: "Sync upcoming books from Hardcover"
    description: "Queries Hardcover's GraphQL API for books with a future release_date and imports them, crediting authors. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'

getRecommendations:
  post:
    tags: [Media]
    operationId: getRecommendations
    summary: "Get recommended media content"
    description: "Returns a list of recommended movies based on"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/media-schemas.yaml#/components/schemas/MediaItemResponse'
