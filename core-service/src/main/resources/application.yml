spring:
  application:
    name: core-service

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/umt}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    oauth:
      client-id: umt-swagger
      use-basic-authentication-with-access-token-request: false
  show-actuator: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  swagger-ui.use-root-path: true

tmdb:
  base-url: https://api.themoviedb.org/3
  api-key: ${TMDB_API_KEY:}

server:
  port: 8081