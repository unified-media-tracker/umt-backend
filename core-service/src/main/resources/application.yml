spring:
  application:
    name: core-service

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/umt}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    oauth:
      client-id: umt-swagger
      use-basic-authentication-with-access-code-grant: false
    use-root-path: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json

  show-actuator: true

logging:
  level:
    com.umt.core: DEBUG
    org.springframework.web: INFO

tmdb:
  base-url: https://api.themoviedb.org/3
  api-key: ${TMDB_API_KEY:}

musicbrainz:
  base-url: https://musicbrainz.org/ws/2
  user-agent: "UMT-CatalogSync/0.1"

igdb:
  client-id: ${IGDB_CLIENT_ID:}
  client-secret: ${IGDB_CLIENT_SECRET:}

server:
  port: 8081