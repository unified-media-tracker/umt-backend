getAllUsers:
  get:
    tags: [User]
    operationId: getAllUsers
    summary: Get all users
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'

createUser:
  post:
    tags: [User]
    operationId: createUser
    summary: Create a new user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResponse'

components:
  schemas:
    UserResponse:
      type: object
      required: [ id, username, email ]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true

    CreateUserRequest:
      type: object
      required: [ keycloakId, username, email ]
      properties:
        keycloakId:
          type: string
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true