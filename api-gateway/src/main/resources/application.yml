spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: core-service-route
          uri: http://${CORE_SERVICE_HOST:localhost}:${CORE_SERVICE_PORT:8081}
          predicates:
            - Path=/api/core/**, /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/umt}
server:
  port: 8080