importMovieFromTmdb:
  post:
    tags: [Media]
    operationId: importMovieFromTmdb
    summary: "Import movie from TMDB"
    description: "Imports a movie from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItemResponse'

importTvShowFromTmdb:
  post:
    tags: [Media]
    operationId: importTvShowFromTmdb
    summary: "Import TV show from TMDB"
    description: "Imports a TV show from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItemResponse'

syncUpcomingMovies:
  post:
    tags: [Media]
    operationId: syncUpcomingMovies
    summary: "Sync upcoming movies from TMDB"
    description: "Queries TMDB's /movie/upcoming and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

syncUpcomingTvSeries:
  post:
    tags: [Media]
    operationId: syncUpcomingTvSeries
    summary: "Sync upcoming TV series from TMDB"
    description: "Queries TMDB's /discover/tv filtered to a future first_air_date and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

syncUpcomingAlbums:
  post:
    tags: [Media]
    operationId: syncUpcomingAlbums
    summary: "Sync upcoming albums from Metacritic + MusicBrainz"
    description: "Scrapes Metacritic's upcoming album calendar for {artist, title, date}, resolves each against MusicBrainz, and imports confident matches. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

syncUpcomingGames:
  post:
    tags: [Media]
    operationId: syncUpcomingGames
    summary: "Sync upcoming games from IGDB"
    description: "Queries IGDB for main-category games with a future first_release_date and imports them. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

syncUpcomingBooks:
  post:
    tags: [Media]
    operationId: syncUpcomingBooks
    summary: "Sync upcoming books from Hardcover"
    description: "Queries Hardcover's GraphQL API for books with a future release_date and imports them, crediting authors. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

getRecommendations:
  post:
    tags: [Media]
    operationId: getRecommendations
    summary: "Get recommended media content"
    description: "Returns a list of recommended movies based on"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaItemRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemResponse'

components:
  schemas:
    MediaItemResponse:
      type: object
      required:
        - id
        - mediaType
        - title
        - releaseDateStatus
        - popularityScore
        - ratingCount
        - externalSource
        - externalSourceId
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          $ref: '#/components/schemas/MediaType'
        title:
          type: string
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        ageRating:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        releaseDateStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        popularityScore:
          type: number
        averageUserRating:
          type: number
          nullable: true
        ratingCount:
          type: integer
          format: int32
        franchiseId:
          type: string
          format: uuid
          nullable: true
        externalSource:
          $ref: '#/components/schemas/ExternalSourceType'
        externalSourceId:
          type: string
        genres:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GenreResponse'
          default: []
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/ContributorResponse'
          default: []

    ContributorResponse:
      type: object
      required: [id, name, contributorType, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contributorType:
          $ref: '#/components/schemas/ContributorType'
        role:
          $ref: '#/components/schemas/RoleType'

    ContributorType:
      type: string
      enum:
        - PERSON
        - ORGANIZATION

    RoleType:
      type: string
      enum:
        - DIRECTOR
        - DEVELOPER
        - AUTHOR
        - ARTIST
        - WRITER
        - STUDIO
        - PUBLISHER

    GenreResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    MediaType:
      type: string
      enum:
        - MOVIE
        - GAME
        - BOOK
        - MUSIC
        - TV_SHOW

    ReleaseStatus:
      type: string
      enum:
        - TBA
        - ANNOUNCED
        - RUMORED
        - CONFIRMED
        - DELAYED
        - RELEASED
        - CANCELED

    ExternalSourceType:
      type: string
      enum:
        - TMDB
        - IGDB
        - MUSICBRAINZ
        - HARDCOVER

    MediaItemRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64