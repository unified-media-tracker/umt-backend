importMovieFromTmdb:
  post:
    tags: [Movie]
    operationId: importMovieFromTmdb
    summary: "Import movie from TMDB"
    description: "Imports a movie from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieResponse'

importTvShowFromTmdb:
  post:
    tags: [TvShow]
    operationId: importTvShowFromTmdb
    summary: "Import TV show from TMDB"
    description: "Imports a TV show from TMDB by its ID. Requires ADMIN role."
    parameters:
      - name: tmdbId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvShowResponse'

syncUpcomingMovies:
  post:
    tags: [Movie]
    operationId: syncUpcomingMovies
    summary: "Sync upcoming movies from TMDB"
    description: "Queries TMDB's /movie/upcoming and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MovieResponse'

syncUpcomingTvSeries:
  post:
    tags: [TvShow]
    operationId: syncUpcomingTvSeries
    summary: "Sync upcoming TV series from TMDB"
    description: "Queries TMDB's /discover/tv filtered to a future first_air_date and imports anything not already known. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TvShowResponse'

syncUpcomingMusic:
  post:
    tags: [Music]
    operationId: syncUpcomingMusic
    summary: "Sync upcoming music from Metacritic + MusicBrainz"
    description: "Scrapes Metacritic's upcoming album calendar for {artist, title, date}, resolves each against MusicBrainz, and imports confident matches. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MusicResponse'

syncUpcomingGames:
  post:
    tags: [Game]
    operationId: syncUpcomingGames
    summary: "Sync upcoming games from IGDB"
    description: "Queries IGDB for main-category games with a future first_release_date and imports them. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GameResponse'

syncUpcomingBooks:
  post:
    tags: [Book]
    operationId: syncUpcomingBooks
    summary: "Sync upcoming books from Hardcover"
    description: "Queries Hardcover's GraphQL API for books with a future release_date and imports them, crediting authors. Requires ADMIN role. Also runs automatically once a day."
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BookResponse'

listMedia:
  get:
    tags: [Media]
    operationId: listMedia
    summary: "List media items"
    description: "Lists media items of one type, optionally filtered by release status and release-date window, and sorted. Public - no auth required."
    parameters:
      - name: mediaCategory
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MediaCategory'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ReleaseStatus'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MediaSortOption'
      - name: releaseDateFrom
        in: query
        required: false
        description: >-
          Only items releasing on or after this date, plus undated (TBA) ones, which can't be
          placed before it. Lets a page skip the back catalogue - pass the first of the current
          month to get what just released this month plus everything still to come.
        schema:
          type: string
          format: date
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaResponse'

getMediaById:
  get:
    tags: [Media]
    operationId: getMediaById
    summary: "Get a media item by id"
    description: >-
      Public - no auth required. mediaCategory is optional - pass it when the caller already knows
      the type (e.g. a search scoped to one type) to look up that one table directly instead of
      trying all five in turn. A mediaCategory that doesn't match the id's real type 404s, the same
      as an unknown id - it does not fall back to searching the other tables.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mediaCategory
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MediaCategory'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaResponse'
      '404':
        description: Not found

getSimilarMedia:
  get:
    tags: [Media]
    operationId: getSimilarMedia
    summary: "Get titles similar to this media item"
    description: >-
      Public - no auth required. "More like this", not personalized - backed by the source
      catalog's own similarity signal (TMDb recommendations for movie/tv, IGDB similar_games
      for game, Hardcover cached_similar_book_ids for book, ListenBrainz similar artists for
      music), filtered to whatever's already in our own catalog. Music is matched by artist:
      the albums returned are the ones by artists similar to the album's own.
      Compare getRecommendations, which is user-personalized and type-agnostic. mediaCategory is
      optional, same meaning and same 404-not-fallback behavior as on getMediaById.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mediaCategory
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MediaCategory'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaResponse'
      '404':
        description: Not found

getRecommendations:
  post:
    tags: [Media]
    operationId: getRecommendations
    summary: "Get recommended media content"
    description: "Returns a list of recommended movies based on"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaItemRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MediaResponse'

components:
  schemas:
    MediaResponse:
      type: object
      required:
        - id
        - mediaCategory
        - title
        - releaseDateStatus
        - popularityScore
        - ratingCount
        - externalSource
        - externalSourceId
      properties:
        id:
          type: string
          format: uuid
        mediaCategory:
          $ref: '#/components/schemas/MediaCategory'
        title:
          type: string
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        ageRating:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        releaseDateStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        popularityScore:
          type: number
        averageUserRating:
          type: number
          nullable: true
        ratingCount:
          type: integer
          format: int32
        franchiseId:
          type: string
          format: uuid
          nullable: true
        externalSource:
          $ref: '#/components/schemas/ExternalSourceType'
        externalSourceId:
          type: string
        genres:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GenreResponse'
          default: []
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/ContributorResponse'
          default: []
        previousReleaseDate:
          type: string
          format: date
          nullable: true
          description: "Not populated yet - release_status_history only keeps a free-text note of a date change, not a structured prior value."
        latestDelayProbability:
          type: number
          nullable: true
          description: "delay_probability from the most recent rumor_snapshot, if one has been computed."
        latestConfidenceTrend:
          allOf:
            - $ref: '#/components/schemas/TrendDirection'
          nullable: true
      discriminator:
        propertyName: mediaCategory
        mapping:
          MOVIE: '#/components/schemas/MovieResponse'
          TV_SHOW: '#/components/schemas/TvShowResponse'
          GAME: '#/components/schemas/GameResponse'
          BOOK: '#/components/schemas/BookResponse'
          MUSIC: '#/components/schemas/MusicResponse'

    MovieResponse:
      allOf:
        - $ref: '#/components/schemas/MediaResponse'
        - type: object
          properties:
            runtimeMinutes:
              type: integer
              format: int32
              nullable: true

    TvShowResponse:
      allOf:
        - $ref: '#/components/schemas/MediaResponse'

    GameResponse:
      allOf:
        - $ref: '#/components/schemas/MediaResponse'

    BookResponse:
      allOf:
        - $ref: '#/components/schemas/MediaResponse'

    MusicResponse:
      allOf:
        - $ref: '#/components/schemas/MediaResponse'

    ContributorResponse:
      type: object
      required: [id, name, contributorType, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contributorType:
          $ref: '#/components/schemas/ContributorType'
        role:
          $ref: '#/components/schemas/RoleType'

    ContributorType:
      type: string
      enum:
        - PERSON
        - ORGANIZATION

    RoleType:
      type: string
      enum:
        - DIRECTOR
        - DEVELOPER
        - AUTHOR
        - ARTIST
        - WRITER
        - STUDIO
        - PUBLISHER

    GenreResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    MediaCategory:
      type: string
      enum:
        - MOVIE
        - GAME
        - BOOK
        - MUSIC
        - TV_SHOW

    ReleaseStatus:
      type: string
      enum:
        - TBA
        - ANNOUNCED
        - RUMORED
        - CONFIRMED
        - DELAYED
        - RELEASED
        - CANCELED

    ExternalSourceType:
      type: string
      enum:
        - TMDB
        - IGDB
        - MUSICBRAINZ
        - HARDCOVER

    MediaSortOption:
      type: string
      enum:
        - RELEASE_DATE
        - DELAY_RISK
        - POPULARITY

    TrendDirection:
      type: string
      enum:
        - RISING
        - FALLING
        - STABLE

    MediaItemRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64